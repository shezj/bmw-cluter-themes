name: Check Store source

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 tools/validate_store_source.py
      - run: python3 -m unittest discover -s tools -p 'test_store_source.py'
      - run: node tools/test_apex_motion.js
      - run: node tools/test_apex_panels.js
      - run: node tools/test_apex_mode_dial.js
      - run: node tools/test_mode_dial_display.js
      - run: node tools/test_gear_display.js
      - run: node tools/test_hud_text.js
